name: Build

# Builds an unsigned Glide.app for Apple silicon and Intel. Unlike the Package
# workflow, this needs no signing secrets: the app is signed ad hoc, so macOS
# asks to confirm opening it the first time.
#
# Pull requests and manual runs upload the apps as a workflow artifact. Pushing
# a fork release tag (v0.2.16-kibo.1), or a manual run on main with `release`
# checked, also publishes a GitHub release with the apps and the changelog
# section of that version; the manual run creates the tag from Cargo.toml.

on:
  pull_request:
    branches: ["main"]
  push:
    tags: ["v*-kibo.*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release for the version in Cargo.toml"
        type: boolean
        default: false

env:
  RELEASE: ${{ github.ref_type == 'tag' || (inputs.release && github.ref == 'refs/heads/main') }}
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  app:
    name: Build app bundle
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Install cargo-packager
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Install parse-changelog
        if: env.RELEASE == 'true'
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: parse-changelog@0.6.14

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install latest stable
        run: |
          rustup update stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Read version
        run: |
          version=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "glide-wm") | .version')
          echo "GLIDE_VERSION=$version" >> "$GITHUB_ENV"
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" != "v$version" ]]; then
            echo "::error::Tag ${{ github.ref_name }} does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package and sign ad hoc
        run: |
          # The release signing identity is not available here.
          sed -i '' '/^macos.signingIdentity/d' Cargo.toml
          for arch in aarch64 x86_64; do
            target="$arch-apple-darwin"
            cargo packager --release --target "$target" --formats app
            app="target/$target/release/Glide.app"
            codesign --force --deep --sign - "$app"
            codesign -v "$app"
            ditto -c -k --keepParent "$app" "Glide_${GLIDE_VERSION}_${arch}.app.zip"
          done
          shasum -a 256 Glide_*.app.zip | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: Glide-${{ env.GLIDE_VERSION }}-${{ github.sha }}
          path: |
            Glide_*.app.zip
            SHA256SUMS

      - name: Write release notes
        if: env.RELEASE == 'true'
        run: |
          {
            parse-changelog CHANGELOG.md "$GLIDE_VERSION"
            cat <<'END'

          ## Installation

          ```sh
          brew install --cask KiboMibo/tap/glide-kibo
          ```

          Or download the zip for your Mac (`aarch64` for Apple silicon, `x86_64`
          for Intel), move `Glide.app` to `/Applications` and remove the
          quarantine flag:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Glide.app
          ```

          The app is signed ad hoc and not notarized. macOS asks for
          Accessibility permission again because the signature differs from the
          official release.

          ## SHA-256

          ```
          END
            cat SHA256SUMS
            echo '```'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.GLIDE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.GLIDE_VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            Glide_*.app.zip
            SHA256SUMS
          fail_on_unmatched_files: true
